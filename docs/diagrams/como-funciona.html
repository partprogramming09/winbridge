<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cómo funciona WinBridge</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cómo funciona · WinBridge</p>
    <h1>Tu Mac pide, tu PC obedece solo lo que tú permites</h1>

    <!-- Diagrama generado con diagram-design (paleta por defecto). Fuente editable: este archivo. -->
    <div class="diagram-container">
      <svg viewBox="0 0 960 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="como-funciona-title como-funciona-desc">
        <title id="como-funciona-title">Cómo funciona WinBridge</title>
        <desc id="como-funciona-desc">Un agente de IA en tu Mac envía una petición por una red privada cifrada a un PC con Windows. WinBridge solo deja ver la pantalla, mover el ratón y escribir; no abre archivos ni ejecuta comandos.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <path d="M280,112 H360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M600,112 H680" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
        <path d="M800,152 V204" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="40" y="80" width="240" height="64" rx="6" fill="#f5f5f5"/><rect x="40" y="80" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="160" y="110" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Tu Mac</text><text x="160" y="130" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">agente de IA</text>
        <rect x="360" y="80" width="240" height="64" rx="6" fill="#f5f5f5"/><rect x="360" y="80" width="240" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="480" y="110" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Red privada</text><text x="480" y="130" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Tailscale, cifrada</text>
        <rect x="680" y="80" width="240" height="64" rx="6" fill="#f5f5f5"/><rect x="680" y="80" width="240" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="800" y="110" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PC con Windows</text><text x="800" y="130" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">WinBridge</text>
        <rect x="300" y="120" width="40" height="14" rx="2" fill="#f5f5f5"/><text x="320" y="130" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PIDE</text>
        <rect x="605" y="120" width="70" height="14" rx="2" fill="#f5f5f5"/><text x="640" y="130" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CON CLAVE</text>
        <rect x="360" y="204" width="560" height="196" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="380" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LO QUE WINBRIDGE PUEDE HACER EN EL PC</text>
        <line x1="640" y1="244" x2="640" y2="384" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="380" y="262" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.1em">PUEDE</text>
        <text x="380" y="288" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif">Ver la pantalla</text>
        <text x="380" y="312" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif">Mover el ratón y hacer clic</text>
        <text x="380" y="336" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif">Escribir y usar atajos</text>
        <text x="380" y="360" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif">Cambiar de ventana</text>
        <text x="380" y="384" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif">Ver datos básicos del PC</text>
        <text x="660" y="262" fill="#bf4520" font-size="11" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.1em">NO INCLUYE</text>
        <text x="660" y="288" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif">Herramienta para leer archivos</text>
        <text x="660" y="312" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif">Línea de comandos</text>
        <text x="660" y="336" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif">Acceso desde Internet</text>
        <text x="660" y="360" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif">Desbloquear el PC</text>
        <rect x="40" y="204" width="280" height="196" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="60" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">QUIÉN PUEDE CONECTARSE</text>
        <text x="60" y="262" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif">Solo tu Mac, con una clave</text>
        <text x="60" y="286" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif">que nadie más tiene.</text>
        <text x="60" y="310" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif">El PC no se ve desde Internet</text>
        <text x="60" y="334" fill="#2d3142" font-size="13" font-family="'Geist', system-ui, sans-serif">ni desde tu red local.</text>
        <text x="60" y="364" fill="#bf4520" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif">Ojo: con el ratón y el teclado</text>
        <text x="60" y="386" fill="#bf4520" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif">puede hacer lo que tú harías.</text>
      </svg>
    </div>
  </div>
</body>
</html>
