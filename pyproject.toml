[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "winbridge-mcp"
version = "0.1.0"
description = "WinBridge MCP Server - Windows desktop bridge over Tailscale"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "winbridge contributors" }]
keywords = ["mcp", "windows", "tailscale", "remote-support", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]
dependencies = [
    # 4.x is outside the reviewed upstream 0.4.24 base; the Windows lock also
    # enforces this ceiling. Re-test before raising it.
    "fastmcp>=3.2.0,<4",
    "pyautogui>=0.9.54",
    "psutil>=5.9.0",
    "pywin32>=306; sys_platform == 'win32'",
    "Pillow>=12.2.0",
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
    "thefuzz[speedup]>=0.20.0",
    "tabulate>=0.9.0",
    "markdownify>=0.13.0",
    "authlib>=1.6.11",
    "cryptography>=50.0.0",
    "python-multipart>=0.0.31",
    "tomli>=2.0.1; python_version < '3.11'",
    "idna>=3.15",
    "starlette>=1.3.1",
    "pyjwt>=2.14.0",
    # Transitive security floors required by FastMCP/Starlette/markdownify.
    "anyio>=4.14.2",
    "httpcore2>=2.10.0",
    "httpx2>=2.12.0",
    "soupsieve>=2.9.0",
]

[project.scripts]
winbridge-mcp = "winremote.__main__:cli"

[project.urls]
Homepage = "https://github.com/partprogramming09/winbridge"
Repository = "https://github.com/partprogramming09/winbridge"
Issues = "https://github.com/partprogramming09/winbridge/issues"
Upstream = "https://github.com/dddabtc/winremote-mcp"
License = "https://github.com/partprogramming09/winbridge/blob/main/LICENSE"

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
dev = ["ruff>=0.9.0", "pytest>=9.0.3", "pygments>=2.20.0"]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "starlette[full]>=0.37.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src/winremote"]
