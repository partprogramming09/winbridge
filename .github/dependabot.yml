version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # fastmcp 4 is a major jump the tests pin below on purpose (tests/test_bootstrap_contract.py); move it by hand.
      - dependency-name: "fastmcp"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "gomod"
    directory: "/agent"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "gomod"
    directory: "/cli"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: "scope"
