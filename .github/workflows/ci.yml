name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.diff.outputs.windows }}
      installer: ${{ steps.diff.outputs.installer }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        name: Decide whether the Windows jobs are needed
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Windows jobs run unless every changed file in a pull request is documentation.
          if [ "$EVENT" != "pull_request" ]; then echo "windows=true" >> "$GITHUB_OUTPUT"; echo "installer=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE_SHA" HEAD)
          # The install tests only matter when the installer, the agent, the bundle tools or this workflow change.
          if echo "$files" | grep -q -E '^(bootstrap/|agent/|tools/|src/|pyproject.toml|uv.lock|.github/workflows/ci.yml)'; then echo "installer=true" >> "$GITHUB_OUTPUT"; else echo "installer=false" >> "$GITHUB_OUTPUT"; fi
          other=$(git diff --name-only "$BASE_SHA" HEAD | grep -v -E '^docs/|\.md$' || true)
          if [ -n "$other" ]; then echo "windows=true" >> "$GITHUB_OUTPUT"; else echo "windows=false" >> "$GITHUB_OUTPUT"; fi

  lint:
    name: Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[test]"
      - name: Run Linux-compatible tests
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_desktop_tools.py \
            -v --tb=short
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        run: |
          pip install pytest-cov
          python -m pytest tests/ --ignore=tests/test_desktop_tools.py --cov=src --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install package and security scanners
        run: |
          pip install -e ".[test]"
          pip install bandit pip-audit zizmor uv
      - name: Bandit static security scan
        run: bandit -q -lll -r src -x tests
      - name: Dependency vulnerability scan
        run: |
          uv export --extra test --format requirements-txt \
            --no-hashes --no-emit-project \
            --output-file /tmp/winbridge-requirements.txt
          pip-audit -r /tmp/winbridge-requirements.txt
      - name: GitHub Actions security scan
        run: zizmor --persona=auditor .github/workflows

  cli:
    name: CLI (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          cache: false
      - name: Vet, format and test
        working-directory: cli
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
          go test ./...
      - name: Build for macOS on Apple silicon
        working-directory: cli
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -o /tmp/winbridge-darwin-arm64 .
      - name: Build for macOS on Intel
        working-directory: cli
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -o /tmp/winbridge-darwin-amd64 .

  agent-go:
    name: Agent (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Vet, format and test
        working-directory: agent
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
          go test ./...
      - name: Vet and build for Windows
        working-directory: agent
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go build -ldflags "-s -w" -o /tmp/winbridge-agent.exe ./cmd/winbridge-agent
          go build -ldflags "-s -w" -o /tmp/desktop-check.exe ./cmd/desktop-check

  windows-contract:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    name: Windows bootstrap contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Parse PowerShell 5.1 scripts
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\check-ps1.ps1
      - name: Parse PowerShell 7 scripts
        shell: pwsh
        run: pwsh -NoProfile -File tools/check-ps1.ps1
      - name: Run bootstrap contract tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-bootstrap.ps1
      - name: Run the job runner against real jobs
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-jobs-runner.ps1
      - name: Run Python contract tests
        shell: pwsh
        run: |
          python -m pip install -e ".[test]"
          python -m pytest tests/test_winbridge_profile.py tests/test_bootstrap_contract.py -v

  windows-install:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    name: Windows install test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        shell: pwsh
        run: python -m pip install uv
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Build the Go agent
        shell: pwsh
        working-directory: agent
        run: |
          go build -ldflags "-s -w" -o "$env:RUNNER_TEMP\winbridge-agent.exe" ./cmd/winbridge-agent
          "WB_GO_AGENT_EXE=$env:RUNNER_TEMP\winbridge-agent.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          go build -o "$env:RUNNER_TEMP\parity-check.exe" ./cmd/parity-check
          "WB_PARITY_EXE=$env:RUNNER_TEMP\parity-check.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build, install, pair, check and uninstall
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\ci-install-test.ps1 -Scenario python

  windows-go-install:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    name: Windows Go install test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Build the Go agent
        shell: pwsh
        working-directory: agent
        run: |
          go build -ldflags "-s -w" -o "$env:RUNNER_TEMP\winbridge-agent.exe" ./cmd/winbridge-agent
          "WB_GO_AGENT_EXE=$env:RUNNER_TEMP\winbridge-agent.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          go build -o "$env:RUNNER_TEMP\parity-check.exe" ./cmd/parity-check
          "WB_PARITY_EXE=$env:RUNNER_TEMP\parity-check.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          go build -o "$env:RUNNER_TEMP\wb-call.exe" ./cmd/wb-call
          "WB_CALL_EXE=$env:RUNNER_TEMP\wb-call.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          go build -o "$env:RUNNER_TEMP\gw-stub.exe" ./cmd/gw-stub
          "WB_GW_STUB_EXE=$env:RUNNER_TEMP\gw-stub.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build, install, pair, check and uninstall
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\ci-install-test.ps1 -Scenario go
